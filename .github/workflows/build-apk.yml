name: Build FixNow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android --org=com.fixnow fixnow_app
          cp app_main.dart fixnow_app/lib/main.dart

      - name: Build APK
        working-directory: fixnow_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FixNow-Android-APK
          path: fixnow_app/build/app/outputs/flutter-apk/app-debug.apk
